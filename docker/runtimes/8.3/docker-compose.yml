version: '3'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - internal

  php:
    image: 026152094229.dkr.ecr.eu-west-2.amazonaws.com/bridge-production-ecr-backend:latest
    networks:
      - internal

networks:
  internal:
    driver: bridge